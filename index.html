
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Heart</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #060208;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<canvas id="heart"></canvas>
<script>
(() => {
"use strict";

const SC = 21, OY = 20;
const DURATION = 10, TICK = 16;
const ANIM = 42, LIFT = 34, GAP = 7;
const SIZES = [9, 10, 11, 12];
const FONT = "Arial";
const BG = "#060208";
const FLASH = [1, 0.78, 0.78];

const PHRASES = [
  "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
  "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
  "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
  "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
  "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю",
  "3000"
];

const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");
const BGC = [6/255, 2/255, 8/255];

let W, H, DPR, unit, originX, originY;
let placed = [], active = [], mainItems = [];
let startTime = 0, lastTime = 0;
let spawnIndex = 0, spawning = true;
let shimmerTimer = 0;
let ready = false;

function rngFactory(seed) {
  let state = seed >>> 0;
  return () => {
    state = (1664525 * state + 1013904223) >>> 0;
    return state / 4294967296;
  };
}
const random = rngFactory(11);

function rand(a, b) {
  return a + random() * (b - a);
}
function choice(arr) {
  return arr[Math.floor(random() * arr.length)];
}
function clamp(v) {
  return Math.max(0, Math.min(1, v));
}
function mix(a, b, k) {
  return a.map((v, i) => v + (b[i] - v) * k);
}
function dim(c, k) {
  return c.map(v => v * k);
}
function hx(c) {
  return "#" + c.map(v =>
    Math.round(clamp(v) * 255).toString(16).padStart(2, "0")
  ).join("");
}
function font(size) {
  return `bold ${size}px ${FONT}`;
}
function measure(text, size) {
  ctx.font = font(size);
  return ctx.measureText(text).width;
}
function lineHeight(size) {
  ctx.font = font(size);
  const m = ctx.measureText("Mg");
  return (m.actualBoundingBoxAscent || size * 0.8)
       + (m.actualBoundingBoxDescent || size * 0.2);
}

function heart(a) {
  return {
    x: 16 * Math.sin(a) ** 3 * SC,
    y: (
      13 * Math.cos(a)
      - 5 * Math.cos(2*a)
      - 2 * Math.cos(3*a)
      - Math.cos(4*a)
    ) * SC + OY
  };
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  unit = Math.min(1, W / 800, H / 800);
  originX = W / 2;
  originY = H / 2;

  if (ready) {
    build();
    startTime = performance.now();
    lastTime = startTime;
    spawnIndex = 0;
    active = [];
    mainItems = [];
    spawning = true;
  }
}

function spans(y, edges) {
  const xs = [];
  for (const [a, b] of edges) {
    if ((a.y <= y && y < b.y) || (b.y <= y && y < a.y)) {
      xs.push(a.x + (y - a.y) * (b.x - a.x) / (b.y - a.y));
    }
  }
  xs.sort((a, b) => a - b);
  const out = [];
  for (let i = 0; i + 1 < xs.length; i += 2) {
    out.push([xs[i], xs[i+1]]);
  }
  return out;
}

function intersect(A, B) {
  const out = [];
  for (const a of A) {
    for (const b of B) {
      const lo = Math.max(a[0], b[0]);
      const hi = Math.min(a[1], b[1]);
      if (hi - lo > 14) out.push([lo, hi]);
    }
  }
  return out;
}

function phraseCycle() {
  let order = [];
  let index = 0;
  return () => {
    if (index >= order.length) {
      order = [...PHRASES];
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      index = 0;
    }
    return order[index++];
  };
}

function build() {
  placed = [];

  const poly = Array.from({length:720}, (_, i) =>
    heart(2 * Math.PI * i / 720)
  );
  const edges = poly.map((p, i) => [p, poly[(i+1) % poly.length]]);
  const ymax = Math.max(...poly.map(p => p.y));
  const ymin = Math.min(...poly.map(p => p.y));
  const cy = (ymax + ymin) / 2;

  const rowH = Math.max(...SIZES.map(lineHeight)) + 4;
  const half = rowH / 2;
  const nextPhrase = phraseCycle();

  for (let y = ymax - half; y > ymin + half; y -= rowH) {
    const row = intersect(spans(y + half, edges), spans(y - half, edges));

    for (let [lo0, hi0] of row) {
      let lo = lo0 + 4;
      let hi = hi0 - 4;
      let cur = lo + rand(0, 8);
      const line = [];

      while (true) {
        let fit = null;

        for (let tries = 0; tries < 10; tries++) {
          const text = nextPhrase();
          const size = choice(SIZES);
          const width = measure(text, size);

          if (cur + width <= hi) {
            fit = {text, size, width};
            break;
          }
        }

        if (!fit) break;

        line.push({
          x: cur + fit.width / 2,
          y,
          text: fit.text,
          size: fit.size,
          width: fit.width
        });
        cur += fit.width + GAP;
      }

      if (!line.length) continue;

      if (line.length > 1) {
        const left = hi - (line[line.length-1].x
          + line[line.length-1].width / 2);

        line.forEach((p, i) => {
          p.x += left * i / (line.length - 1);
        });
      } else {
        line[0].x = (lo + hi) / 2;
      }

      line.forEach((p, i) => {
        p.edge = i === 0 || i === line.length - 1;
        const rad = Math.min(1, Math.hypot(
          p.x / (16 * SC),
          (p.y - cy) / (14.5 * SC)
        ));

        let c = mix([0.58, 0, 0.09], [0.90, 0.05, 0.14],
                    0.25 + 0.75 * rad);
        c = mix(c, [0.98, 0.10, 0.16],
                rand(0, 0.35) + (p.edge ? 0.3 : 0));
        p.color = c.map(v => Math.min(1, v));
        p.rad = rad;
        placed.push(p);
      });
    }
  }

  const edgesOnly = placed.filter(p => p.edge);
  const inner = placed.filter(p => !p.edge);

  edgesOnly.sort((a, b) =>
    (Math.atan2(a.x, a.y-cy) % (2*Math.PI))
    - (Math.atan2(b.x, b.y-cy) % (2*Math.PI))
  );
  inner.sort((a, b) => -a.rad + rand(0, 0.08));

  placed = [...edgesOnly, ...inner];
}

function position(x, y) {
  return {
    x: originX + x * unit,
    y: originY - y * unit
  };
}

function spawn(p) {
  const pos = position(p.x, p.y);
  p.f = 0;
  p.dx = rand(-10, 10);
  p.py = pos.y;
  p.px = pos.x;
  p.colorHex = hx(p.color);
  active.push(p);
  mainItems.push(p);
}

function drawText(text, x, y, size, color, shadow = 0) {
  ctx.font = font(size);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = shadow;
  ctx.fillText(text, x, y);
  ctx.shadowBlur = 0;
}

function animate(p) {
  p.f++;
  const u = clamp(p.f / ANIM);
  const e = 1 - Math.pow(1-u, 3);
  const pos = position(p.x, p.y);
  const x = pos.x;
  const y = pos.y;
  const hover = (1-e) * LIFT * unit;
  const px = x + p.dx * (1-e) * unit;
  const py = y - hover;
  const c = p.color;

  const shadow = hx(mix(BGC, dim(c, 0.30), e));
  const halo = hx(mix(BGC, dim(c, 0.20), e*e));
  const flash = 0.75 * Math.sin(Math.PI * clamp((u-0.55)/0.45));
  const main = hx(mix(mix(BGC, c, e**1.5), FLASH, flash));

  drawText(p.text, px + 2*unit, py + 3*unit,
           p.size, shadow, 0);
  drawText(p.text, px, py, p.size + 1, halo, 8*unit);
  drawText(p.text, px, py, p.size, main, 3*unit);

  if (u >= 1) {
    p.done = true;
    return false;
  }
  return true;
}

function shimmer(now) {
  if (now < shimmerTimer) return;
  shimmerTimer = now + 140;

  if (!mainItems.length) return;

  const p = choice(mainItems);
  p.flashUntil = now + 260;
}

function draw(now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (spawning) {
    const elapsed = now - startTime;
    const target = Math.min(
      placed.length,
      Math.floor(elapsed / (DURATION * 1000) * placed.length)
    );

    while (spawnIndex < target) {
      spawn(placed[spawnIndex++]);
    }

    if (spawnIndex >= placed.length) spawning = false;
  }

  const alive = [];
  for (const p of active) {
    if (animate(p)) alive.push(p);
  }
  active = alive;

  if (!spawning && active.length === 0) {
    shimmer(now);

    for (const p of mainItems) {
      const pos = position(p.x, p.y);
      const flashing = p.flashUntil && now < p.flashUntil;
      const c = flashing ? hx(mix(p.color, FLASH, 0.6)) : p.colorHex;
      drawText(p.text, pos.x, pos.y, p.size, c, 2*unit);
    }
  }

  requestAnimationFrame(draw);
}

resize();
build();
ready = true;
startTime = performance.now();
lastTime = startTime;
requestAnimationFrame(draw);
window.addEventListener("resize", resize);
})();
</script>
</body>
</html>
