
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #060208;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let w, h, scale;
let start = performance.now();

const phrases = [
  "I love you",
  "Seni seviyorum",
  "Te amo",
  "Je t'aime",
  "Ich liebe dich",
  "Ti amo",
  "Eu te amo",
  "Я тебя люблю",
  "사랑해",
  "愛してる",
  "我爱你",
  "मैं तुमसे प्यार करता हूँ",
  "Σ' αγαπώ",
  "Ik hou van jou",
  "Jag älskar dig",
  "Kocham cię"
];

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  w = window.innerWidth;
  h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scale = Math.min(w / 38, h / 34);
}

window.addEventListener("resize", resize);
resize();

function heart(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),
    y: 13 * Math.cos(t)
      - 5 * Math.cos(2 * t)
      - 2 * Math.cos(3 * t)
      - Math.cos(4 * t)
  };
}

const particles = [];

for (let i = 0; i < 180; i++) {
  const a = Math.random() * Math.PI * 2;
  const p = heart(a);
  const spread = 0.65 + Math.random() * 0.4;

  particles.push({
    x: p.x * spread,
    y: p.y * spread,
    size: 0.5 + Math.random() * 1.7,
    phase: Math.random() * Math.PI * 2,
    speed: 0.5 + Math.random() * 2
  });
}

function draw(now) {
  const elapsed = (now - start) / 1000;

  ctx.clearRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2 - 12;
  const s = scale * (1 + Math.sin(elapsed * 2) * 0.018);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, -s);

  const glow = 0.65 + Math.sin(elapsed * 2.5) * 0.2;

  ctx.beginPath();

  for (let i = 0; i <= 720; i++) {
    const p = heart(i / 720 * Math.PI * 2);

    if (i === 0) {
      ctx.moveTo(p.x, p.y);
    } else {
      ctx.lineTo(p.x, p.y);
    }
  }

  ctx.closePath();

  ctx.shadowColor = "#ff174f";
  ctx.shadowBlur = 18 + glow * 20;
  ctx.fillStyle = "rgba(100, 0, 28, 0.18)";
  ctx.fill();

  ctx.strokeStyle = `rgba(255, 35, 85, ${glow})`;
  ctx.lineWidth = 0.09;
  ctx.stroke();

  ctx.shadowBlur = 12;

  for (const p of particles) {
    const twinkle =
      0.3 + 0.7 * Math.abs(Math.sin(elapsed * p.speed + p.phase));

    ctx.beginPath();
    ctx.arc(
      p.x,
      p.y,
      p.size / s * 0.12,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = `rgba(255, ${35 + twinkle * 50}, ${75 + twinkle * 70}, ${twinkle})`;
    ctx.fill();
  }

  ctx.restore();

  const index = Math.floor(elapsed / 2.5) % phrases.length;
  const localTime = (elapsed % 2.5) / 2.5;
  const alpha = Math.min(1, localTime * 4, (1 - localTime) * 4);

  ctx.save();
  ctx.globalAlpha = Math.max(0, alpha);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `bold ${Math.max(19, Math.min(30, w * 0.065))}px Arial`;
  ctx.shadowColor = "#ff174f";
  ctx.shadowBlur = 20;
  ctx.fillStyle = "#fff0f5";
  ctx.fillText(phrases[index], w / 2, h / 2 + scale * 14 + 25);
  ctx.restore();

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
